<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Work | Mukamal</title>
    <meta name="description" content="Case studies and results from Mukamal — UX audits, CRO redesigns, and design systems that drive measurable revenue growth.">
    <link rel="icon" type="image/png" href="assets/brand/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .work-hero { padding-top: 180px; padding-bottom: 80px; }
        .filter-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 48px; }
        .filter-btn {
            background: transparent; border: 1px solid var(--border2); color: var(--dim);
            font-family: var(--font-m); font-size: 12px; text-transform: uppercase;
            padding: 8px 20px; border-radius: var(--radius-pill); cursor: pointer; transition: all 0.3s;
        }
        .filter-btn:hover, .filter-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
        .work-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; }
        @media (max-width: 768px) { .work-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <main>
        <section class="work-hero">
            <div class="container">
                <p class="mono-accent reveal">Selected Work</p>
                <h1 class="reveal" style="font-size: clamp(64px, 8vw, 120px);">RESULTS THAT<br><span style="color: var(--accent);">SPEAK.</span></h1>
                <p class="reveal mt-md text-dim" style="max-width: 560px; font-size: 20px;">Every project is a clinical intervention. We diagnose, design, test, and measure. Here's the proof.</p>
            </div>
        </section>

        <section class="section-sm">
            <div class="container">
                <div class="filter-bar" id="filter-bar">
                    <button class="filter-btn active" data-filter="all">All</button>
                </div>
                <div class="work-grid stagger-grid" id="work-grid">
                    <!-- Populated from case-studies.json -->
                </div>
            </div>
        </section>

        <section class="cta-section">
            <div class="container" style="text-align: center;">
                <p class="mono" style="color: var(--bg);">Want results like these?</p>
                <h2 style="font-size: 80px; color: var(--bg); margin-top: 16px;">LET'S TALK.</h2>
                <a href="/contact.html" class="btn btn-large" style="margin-top: 40px; background: var(--bg); color: var(--text);">Start a Project &rarr;</a>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        fetch('data/case-studies.json')
            .then(r => r.json())
            .then(studies => {
                const grid = document.getElementById('work-grid');
                const filterBar = document.getElementById('filter-bar');

                // Build category filters
                const categories = [...new Set(studies.map(s => s.category))];
                categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'filter-btn';
                    btn.dataset.filter = cat;
                    btn.textContent = cat;
                    filterBar.appendChild(btn);
                });

                // Render cards
                function renderCards(filter) {
                    grid.innerHTML = '';
                    const filtered = filter === 'all' ? studies : studies.filter(s => s.category === filter);
                    filtered.forEach(study => {
                        const card = document.createElement('a');
                        card.href = study.url;
                        card.className = 'work-card';
                        card.innerHTML = `
                            <div class="work-card-img" style="background: url('${study.image}') center/cover no-repeat;"></div>
                            <div class="work-card-body">
                                <div class="work-card-tags">${study.tags.map(t => `<span>${t}</span>`).join('')}</div>
                                <h3>${study.title.toUpperCase()}</h3>
                                <p>${study.summary}</p>
                                <div class="work-card-metric">${study.metric} &rarr;</div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                }

                renderCards('all');

                // Filter clicks
                filterBar.addEventListener('click', (e) => {
                    if (e.target.classList.contains('filter-btn')) {
                        filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        renderCards(e.target.dataset.filter);
                    }
                });
            });
    </script>
</body>
</html>
